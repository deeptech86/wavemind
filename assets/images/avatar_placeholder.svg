<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A1E36"/>
      <stop offset="55%" stop-color="#2E5C70"/>
      <stop offset="100%" stop-color="#E09F67"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="100%" r="65%">
      <stop offset="0%" stop-color="#F7D9A8"/>
      <stop offset="45%" stop-color="#E09F67" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#E09F67" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#sky)"/>
  <circle cx="100" cy="200" r="120" fill="url(#sun)"/>

  <!-- Seated meditation silhouette, lotus position -->
  <g fill="#0A1E36">
    <circle cx="100" cy="62" r="18"/>
    <ellipse cx="100" cy="88" rx="14" ry="16"/>
    <ellipse cx="100" cy="140" rx="55" ry="45"/>
    <circle cx="55" cy="175" r="22"/>
    <circle cx="145" cy="175" r="22"/>
  </g>
</svg>
